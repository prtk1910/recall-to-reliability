[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "recall-to-reliability"
version = "0.1.0"
description = "A reproducible causal test bed for long-term LLM memory systems"
requires-python = ">=3.12"
license = {text = "MIT"}

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
